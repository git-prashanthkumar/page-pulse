<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Pulse — URL Audit Tool</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 640px;
      margin: 60px auto;
      padding: 0 20px;
      background: #0f1117;
      color: #e5e7eb;
    }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    p.subtitle { color: #9ca3af; margin-top: 0; }
    form { display: flex; gap: 8px; margin: 24px 0; }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #e5e7eb;
      font-size: 14px;
    }
    button {
      padding: 10px 18px;
      border-radius: 6px;
      border: none;
      background: #6366f1;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #result {
      background: #1f2937;
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 13px;
      display: none;
    }
    #error { color: #f87171; margin-top: 12px; display: none; }
    footer {
      margin-top: 48px;
      font-size: 12px;
      color: #6b7280;
      text-align: center;
    }
    footer a { color: #9ca3af; }
  </style>
</head>
<body>
  <h1>Page Pulse</h1>
  <p class="subtitle">Enter a URL to run a production-grade site audit.</p>

  <form id="audit-form">
    <input type="text" id="url-input" placeholder="https://example.com" required />
    <button type="submit" id="submit-btn">Audit</button>
  </form>

  <div id="error"></div>
  <div id="result"></div>

  <footer>
    Built for Digital Heroes Training Task — <a href="https://digitalheroesco.com" target="_blank">digitalheroesco.com</a>
  </footer>

  <script>
    const form = document.getElementById('audit-form');
    const input = document.getElementById('url-input');
    const button = document.getElementById('submit-btn');
    const resultBox = document.getElementById('result');
    const errorBox = document.getElementById('error');

    // Point this at your deployed backend once it's live.
    // Leave as-is for local testing against http://localhost:3000
    const API_BASE = 'https://page-pulse-n8eu.onrender.com';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultBox.style.display = 'none';
      errorBox.style.display = 'none';
      button.disabled = true;
      button.textContent = 'Auditing...';

      try {
        const res = await fetch(`${API_BASE}/api/audit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: input.value }),
        });
        const data = await res.json();

        if (!res.ok) {
          errorBox.textContent = data.message || 'Something went wrong.';
          errorBox.style.display = 'block';
        } else {
          resultBox.textContent = JSON.stringify(data, null, 2);
          resultBox.style.display = 'block';
        }
      } catch (err) {
        errorBox.textContent = 'Could not reach the server.';
        errorBox.style.display = 'block';
      } finally {
        button.disabled = false;
        button.textContent = 'Audit';
      }
    });
  </script>
</body>
</html>
